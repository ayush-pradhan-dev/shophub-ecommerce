{% extends 'base.html' %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Login</button>
    </form>
    <p class="text-sm text-gray-500 mt-4">No account? <a href="{% url 'users:signup' %}" class="text-indigo-600 hover:underline">Sign up</a></p>
</div>
{% endblock %}
