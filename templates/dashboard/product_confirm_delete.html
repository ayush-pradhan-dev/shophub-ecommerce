{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Delete Product — ShopHub{% endblock %}

{% block dashboard_content %}
<div class="bg-white rounded-lg shadow p-6 max-w-md">
    <h1 class="text-xl font-bold mb-4">Delete "{{ object.name }}"?</h1>
    <p class="text-gray-600 mb-6">This action cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Yes, Delete</button>
        <a href="{% url 'dashboard:product_list' %}" class="ml-2 text-gray-600 hover:underline">Cancel</a>
    </form>
</div>
{% endblock %}
