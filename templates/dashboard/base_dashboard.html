{% extends 'base.html' %}
{% block content %}
<div class="flex gap-8">
    <aside class="w-56 flex-shrink-0">
        <nav class="bg-white rounded-lg shadow p-4 space-y-1">
            <a href="{% url 'dashboard:home' %}" class="block px-3 py-2 rounded hover:bg-indigo-50">Overview</a>
            <a href="{% url 'dashboard:product_list' %}" class="block px-3 py-2 rounded hover:bg-indigo-50">My Products</a>
            <a href="{% url 'dashboard:order_list' %}" class="block px-3 py-2 rounded hover:bg-indigo-50">My Orders</a>
        </nav>
    </aside>
    <div class="flex-1">
        {% if messages %}
            {% for message in messages %}
            <div class="bg-green-50 text-green-700 px-4 py-2 rounded mb-4">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block dashboard_content %}{% endblock %}
    </div>
</div>
{% endblock %}
